# drevo.myryadom.su -> приложение «Древо» на 127.0.0.1:8095
server {
    listen 80;
    listen [::]:80;
    server_name drevo.myryadom.su;
    server_tokens off;
    location /.well-known/acme-challenge/ {
        root /srv/drevo/acme;
        try_files $uri =404;
    }
    location / { return 308 https://drevo.myryadom.su$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drevo.myryadom.su;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/drevo.myryadom.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drevo.myryadom.su/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Один файл альбома: сервер принимает до 20 МБ (крупный PDF) и миниатюру к нему.
    client_max_body_size 25m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Обновления у всех сразу: поток событий отдаётся без накопления и не рвётся по таймауту
    # (сервер шлёт пустую строку раз в 25 секунд).
    location = /api/events {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
