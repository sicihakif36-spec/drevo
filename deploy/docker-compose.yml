name: drevo

services:
  db:
    # Тот же закреплённый образ, что у «Мы рядом»: уже есть на сервере.
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: unless-stopped
    environment:
      POSTGRES_DB: drevo
      POSTGRES_USER: drevo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте в deploy/.env}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U drevo -d drevo"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    cpus: 1

  app:
    build:
      context: ..
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://drevo:${POSTGRES_PASSWORD}@db:5432/drevo
      PUBLIC_URL: ${PUBLIC_URL:-https://drevo.myryadom.su}
    ports:
      - "127.0.0.1:8095:8095"
    volumes:
      - media:/data
    mem_limit: 384m
    cpus: 1

volumes:
  db:
  media:
