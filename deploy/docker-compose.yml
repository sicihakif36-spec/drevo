name: drevo

# Журналы контейнеров: не больше 3 файлов по 10 МБ, иначе за годы они займут весь диск.
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "3" }

services:
  db:
    # Тот же закреплённый образ, что у «Мы рядом»: уже есть на сервере.
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: unless-stopped
    environment:
      POSTGRES_DB: drevo
      POSTGRES_USER: drevo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте в deploy/.env}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U drevo -d drevo"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    cpus: 1
    logging: *logging

  app:
    build:
      context: ..
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://drevo:${POSTGRES_PASSWORD}@db:5432/drevo
      PUBLIC_URL: ${PUBLIC_URL:-https://drevo.myryadom.su}
    ports:
      - "127.0.0.1:8095:8095"
    volumes:
      - media:/data
    # Замер на дереве из 4373 человек с 2166 фото: печать всего дерева плакатом A0 — до 500 МБ,
    # вместе с переводом 15-минутной записи в MP3 (ffmpeg, +20 МБ). При 384 МБ контейнер падал. Обычно — 60–100 МБ.
    mem_limit: 768m
    cpus: 1
    logging: *logging

volumes:
  db:
  media:
