# Тесты сервера на настоящей PostgreSQL и сборка интерфейса при каждой отправке кода.
name: Проверки

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: drevo
          POSTGRES_PASSWORD: drevo
          POSTGRES_DB: drevo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U drevo -d drevo"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://drevo:drevo@127.0.0.1:5432/drevo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: ffmpeg для записей голоса
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - name: Сервер
        working-directory: server
        run: npm ci --no-audit --no-fund && npm test
      - name: Интерфейс
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
